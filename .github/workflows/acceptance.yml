name: Journal acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-and-hosted-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hosted/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: hosted
      - run: npm test
        working-directory: hosted
